:root{
  --cream:#F7F5F0; --ink:#0B1220; --grey:#6B7280;
  --green:#16B47E; --coralDeep:#D9432F;
  --ui:"RInter","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"RDisplay","Inter Display","Inter",system-ui,-apple-system,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#15171C;color:#E8E8EA;font-family:var(--ui);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;
  background:var(--cream);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;contain:strict}
#stage .bgglow{position:absolute;inset:0;background:radial-gradient(900px 1300px at 50% 46%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%)}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:500px 1000px}
.abs{position:absolute;left:0;top:0}
.emo{font-family:var(--emoji);line-height:1}

/* tarjetas del ruido (más grandes que en horizontal para leerse en el móvil) */
.card{position:absolute;overflow:hidden;background:#fff;border-radius:32px;
  box-shadow:0 16px 38px rgba(30,30,50,.09),0 2px 6px rgba(30,30,50,.05);will-change:transform,opacity}
.cc{position:absolute;left:0;top:0;height:118px;display:flex;align-items:center;gap:18px;padding:0 38px 0 22px;
  white-space:nowrap;transform-origin:0 0}
.tile{position:relative;flex:none;width:74px;height:74px;border-radius:21px;display:grid;place-items:center;font-size:39px}
.tx{display:flex;flex-direction:column;gap:6px}
.lbl{font-weight:600;font-size:31px;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.amt{font-weight:800;font-size:35px;line-height:1;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.amt.out{color:var(--coralDeep)} .amt.in{color:#12945F}
.badge{position:absolute;right:-10px;bottom:-10px;width:40px;height:40px;border-radius:50%;background:var(--green);
  color:#fff;font:700 22px/34px var(--ui);text-align:center;border:3px solid #fff}

/* formulario vertical */
.form{position:absolute;left:0;top:0;width:840px;height:620px}
.form .ttl{position:absolute;left:48px;top:46px;font:800 54px/1 var(--display);letter-spacing:-.03em}
.inp{position:absolute;height:108px;border-radius:26px;border:3px solid #E7E4DC;background:#FBFAF7;
  display:flex;align-items:center;gap:16px;padding:0 28px;font-size:40px;font-weight:500;white-space:nowrap;overflow:hidden}
.inp .ph{color:#A3A6AE}
.inp .val{color:var(--ink);font-weight:600}
.caret{display:inline-block;width:4px;height:46px;background:var(--green);margin-left:2px;vertical-align:middle;border-radius:2px}
.btn{position:absolute;left:432px;top:264px;width:360px;height:108px;border-radius:26px;background:var(--green);color:#fff;
  font:700 40px/108px var(--ui);text-align:center;box-shadow:0 14px 30px rgba(22,180,126,.34)}
.btn span{position:absolute;inset:0}
.chip{position:absolute;width:364px;height:82px;border-radius:41px;padding:0 24px;display:flex;align-items:center;gap:14px;background:#F2F0EA;
  font-size:33px;font-weight:600;color:#3B4150;border:3px solid transparent;white-space:nowrap}
.chip .emo{font-size:34px}

#cursor{position:absolute;left:0;top:0;width:70px;height:70px;transform-origin:10px 8px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.22))}

/* titulares */
.cap{position:absolute;left:80px;width:840px;text-align:center;font-family:var(--display);font-weight:800;
  letter-spacing:-.035em;color:var(--ink)}
.cap .ln{display:block;white-space:nowrap;line-height:1.08}
.cap .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .14em;margin-bottom:-.14em}
.cap .wi{display:inline-block;will-change:transform}
.cap .sp{display:inline-block;width:.26em}

/* gráfico */
.panel{position:absolute;background:#fff;border-radius:44px;box-shadow:0 30px 70px rgba(30,30,50,.08),0 3px 10px rgba(30,30,50,.04)}
.ctitle{position:absolute;left:44px;top:34px;font:600 36px/1 var(--ui);color:var(--grey)}
.bar{position:absolute;border-radius:12px}
.axisLbl{position:absolute;width:260px;margin-left:-130px;text-align:center;font:600 34px/1 var(--ui);color:#4B5160}
.valLbl{position:absolute;width:280px;margin-left:-140px;text-align:center;font:800 54px/1 var(--display);letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;transform-origin:50% 100%}
.brk{position:absolute;display:flex;align-items:center;gap:14px;white-space:nowrap}
.brk .sw{width:12px;height:76px;border-radius:6px}
.brk .tile{width:68px;height:68px;border-radius:20px;font-size:36px}
.brk .n{font:600 33px/1.1 var(--ui);color:var(--grey)}
.brk .v{font:800 42px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#eq{position:absolute;left:80px;width:840px;text-align:center;font:700 40px/1 var(--ui);color:#4B5160;white-space:nowrap;font-variant-numeric:tabular-nums}
#eq b{font-family:var(--display);font-weight:800;color:#2F6FD6;font-size:48px;letter-spacing:-.02em}

/* meta (vertical) */
#goal{position:absolute;border-radius:44px;background:linear-gradient(150deg,#7C3AED 0%,#5B3FE6 55%,#4F46E5 100%);
  box-shadow:0 34px 70px rgba(79,70,229,.30)}
#goal .gc{position:absolute;left:0;top:0;height:750px;transform-origin:0 0;color:#fff}
.g-eye{position:absolute;left:184px;top:60px;font:800 30px/1.4 var(--display);letter-spacing:.28em;color:rgba(255,255,255,.82);white-space:nowrap}
.g-pct{position:absolute;left:50px;top:212px;font:900 180px/1 var(--display);letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.g-big{position:absolute;left:56px;top:450px;font:900 86px/1 var(--display);letter-spacing:-.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.g-track{position:absolute;left:56px;right:56px;top:580px;height:60px;border-radius:30px;background:rgba(255,255,255,.22);transform-origin:0 50%}
.g-fill{position:absolute;top:0;height:60px;border-radius:30px;background:#fff}
.g-l{position:absolute;left:56px;top:672px;font:700 36px/1 var(--ui);white-space:nowrap;font-variant-numeric:tabular-nums}
.g-r{position:absolute;right:56px;top:672px;font:700 36px/1 var(--ui);white-space:nowrap}
.g-chip{position:absolute;right:56px;top:296px;height:64px;padding:0 28px;border-radius:32px;background:#fff;color:#4F46E5;
  font:800 32px/64px var(--ui);white-space:nowrap;transform-origin:50% 50%;box-shadow:0 10px 22px rgba(30,20,90,.25)}

/* panel móvil */
#win{position:absolute;left:80px;top:432px;width:840px;height:1168px;border-radius:52px;background:#FBFAF7;border:1px solid #ECE9E2;
  box-shadow:0 40px 90px rgba(30,30,50,.12)}
.logo{position:absolute;font:800 46px/1 var(--display);letter-spacing:-.03em}
.greet{position:absolute;font:800 64px/1 var(--display);letter-spacing:-.035em;white-space:nowrap}
.stat{position:absolute;background:#fff;border-radius:36px;box-shadow:0 18px 44px rgba(30,30,50,.08)}
.s-eye{position:absolute;left:40px;top:32px;font:800 28px/1 var(--display);letter-spacing:.2em;color:#7A808C;white-space:nowrap}
.s-amt{position:absolute;left:40px;top:84px;font:900 88px/1 var(--display);letter-spacing:-.045em;font-variant-numeric:tabular-nums;white-space:nowrap}
.s-bar{position:absolute;left:430px;top:108px;height:40px;width:290px;border-radius:20px;background:#F1EFEA;overflow:hidden}
.s-seg{position:absolute;top:0;height:40px}

.ft{position:absolute;display:grid;place-items:center;border-style:solid;border-color:#fff;will-change:transform}

/* cierre */
#brand{position:absolute;left:80px;top:580px;width:840px;text-align:center;font:900 256px/1 var(--display);letter-spacing:-.06em;white-space:nowrap}
#brand .m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .01em .06em}
#brand .l{display:inline-block}
.tag{position:absolute;left:80px;width:840px;text-align:center;white-space:nowrap}
#tagline{top:880px;font:800 52px/1.32 var(--display);letter-spacing:.2em;color:#5B6170}
#tagline b{color:var(--green);font-weight:800}
#cta{top:1060px;font:500 46px/1.28 var(--ui);color:#3D4451;letter-spacing:-.01em}
#url{position:absolute;left:500px;top:1240px;height:104px;padding:0 56px;border-radius:52px;background:var(--green);color:#fff;
  font:700 46px/104px var(--ui);white-space:nowrap;box-shadow:0 18px 36px rgba(22,180,126,.30);transform-origin:50% 50%}

/* zonas de seguridad (sólo revisión) */
#safe{position:absolute;inset:0;pointer-events:none;display:none;z-index:50}
#safe div{position:absolute;background:repeating-linear-gradient(45deg,rgba(255,0,80,.18) 0 14px,rgba(255,0,80,.06) 14px 28px)}
#app.safe #safe{display:block}

/* controles */
#controls{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#1C1F26;border-top:1px solid #2A2E37;flex-wrap:wrap}
#controls button{background:#2A2E37;color:#F1F1F3;border:0;border-radius:10px;height:38px;min-width:38px;padding:0 14px;font:600 14px var(--ui);cursor:pointer}
#controls button:hover{background:#353A45}
#controls button.primary{background:#16B47E;color:#fff}
#scrubWrap{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
#scrub{width:100%;accent-color:#16B47E}
#marks{position:relative;height:16px;font:500 11px/16px var(--ui);color:#9AA0AB}
#marks span{position:absolute;transform:translateX(-50%);cursor:pointer;white-space:nowrap}
#marks span:hover{color:#fff}
#time{font:600 14px var(--ui);font-variant-numeric:tabular-nums;color:#C9CCD3;min-width:118px;text-align:center}
#app.rec #controls{display:none}
#app.rec{background:#000}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:600 18px var(--ui);color:#9AA0AB;background:#15171C;z-index:5}
#hint{position:fixed;right:16px;bottom:16px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font:500 13px var(--ui);opacity:0;transition:opacity .4s;pointer-events:none}
</style>
</head>

function bezier(x1,y1,x2,y2){
  const A=(a,b)=>1-3*b+3*a, B=(a,b)=>3*b-6*a, C=a=>3*a;
  const calc=(t,a,b)=>((A(a,b)*t+B(a,b))*t+C(a))*t;
  const slope=(t,a,b)=>3*A(a,b)*t*t+2*B(a,b)*t+C(a);
  return x=>{ if(x<=0) return 0; if(x>=1) return 1;
    let t=x; for(let i=0;i<8;i++){ const s=slope(t,x1,x2); if(Math.abs(s)<1e-6) break; t-=(calc(t,x1,x2)-x)/s; }
    let lo=0,hi=1; if(Math.abs(calc(t,x1,x2)-x)>1e-5){ t=x; for(let i=0;i<30;i++){ const v=calc(t,x1,x2); if(v<x) lo=t; else hi=t; t=(lo+hi)/2; } }
    return calc(t,y1,y2); };
}

  swift:   bezier(.72,0,.18,1),
  glide:   bezier(.45,0,.2,1),
  inOut:   bezier(.45,0,.55,1),
  out:     bezier(.33,1,.68,1),
  exit:    bezier(.6,0,.9,.45),
  anticip: bezier(.3,0,.7,1),
};
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,p)=>a+(b-a)*p;
const prog=(t,t0,d)=>clamp((t-t0)/d);
function kf(t,keys){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=1;i<keys.length;i++){ const k=keys[i]; if(t<=k[0]){ const p=keys[i-1]; return lerp(p[1],k[1],(k[2]||E.inOut)((t-p[0])/(k[0]-p[0]))); } }
  return keys[keys.length-1][1];
}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function mixC(a,b,p){ const A=hex(a),B=hex(b); return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],clamp(p)))).join(",")})`; }
function mixPose(a,b,p){ const o={}; for(const k in a) o[k]=(typeof a[k]==="number"&&typeof b[k]==="number")?lerp(a[k],b[k],p):(p<.5?a[k]:b[k]); return o; }

/* titulares multilínea; el tamaño se ajusta solo para no salir de la zona segura */
function makeCap(lines,size,pos){
  const d=el("div","cap",caps); d.style.fontSize=size+"px";
  const ws=[], lns=[];
  lines.forEach(words=>{ const ln=el("div","ln",d); lns.push(ln);
    words.forEach((w,i)=>{ const o=typeof w==="string"?{w}:w; const m=el("span","w",ln); const inner=el("span","wi",m,o.w); if(o.c) inner.style.color=o.c; ws.push(inner); if(i<words.length-1) el("span","sp",ln); }); });
  return {el:d,ws,lns,size,pos};
}
function placeCap(c){ // ajusta tamaño y coloca (pos.top fijo o pos.cy centrado)
  let f=c.size; c.el.style.fontSize=f+"px";
  const wmax=Math.max(...c.lns.map(l=>l.scrollWidth));
  if(wmax>820){ f=Math.floor(f*820/wmax); c.el.style.fontSize=f+"px"; }
  c.font=f; const h=c.el.offsetHeight;
  c.el.style.top = (c.pos.cy!=null ? c.pos.cy-h/2 : c.pos.top)+"px";
}

function renderCaps(t){
  for(const k of CAPS){
    const {c}=k; let any=false;
    c.ws.forEach((w,i)=>{
      const st = (k.st[i]!=null?k.st[i]:i*0.06);
      const pin = prog(t, k.tin+st, k.din), pout = prog(t, k.tout+i*k.sto, k.dout);
      const ein = (k.ease?E[k.ease]:E.brake)(pin), eout=E.exit(pout);

function float(n,t){ const env = clamp((t-(n.t0+n.d))/0.6);
  return [Math.sin(t*1.1+n.i*1.7)*5*env, Math.cos(t*0.9+n.i*2.3)*5*env, Math.sin(t*0.7+n.i)*0.6*env]; }
function poseScatter(n,t){ const f=float(n,t); return {cx:n.x+f[0], cy:n.y+f[1], w:n.w, h:CARD_H, r:32, rot:n.rot+f[2], s:1, o:1, blur:0, bg:0, cO:1}; }
function poseEnter(n,t){
  const p=prog(t,n.t0,n.d), e=E.brake(p), P=poseScatter(n,t);
  P.cx+=n.from[0]*(1-e); P.cy+=n.from[1]*(1-e); P.rot+=n.spin*(1-e);
  P.s = p<0.62 ? lerp(0.55,1.045,E.out(p/0.62)) : lerp(1.045,1,E.inOut((p-0.62)/0.38));
  P.o = clamp(p*5); return P;
}
function poseGhost(n){ // se abren hacia arriba y abajo para dejar el centro al formulario
  const dx=n.x-540, dy=n.y-930;
  return {cx:540+dx*1.12, cy:930+dy*1.3+(dy>0?60:-40), w:n.w, h:CARD_H, r:32, rot:n.rot*1.6, s:0.8, o:0.2, blur:6, bg:0, cO:1};
}
function posePill(n){ return {cx:n.pill.cx, cy:n.pill.cy, w:n.pill.w, h:n.pill.h, r:32, rot:0, s:1, o:1, blur:0, bg:0, cO:1}; }
function poseSeg(n){ const r=SEG[n.segK]; return {cx:r.x+r.w/2, cy:r.y+r.h/2, w:r.w, h:r.h, r:12, rot:0, s:1, o:1, blur:0, bg:1, cO:0}; }
const FORM = {cx:CX, cy:910, w:840, h:620, r:44, rot:0, s:1, o:1, blur:0, bg:0, cO:0};

function cardPose(n,t){
  const scat0 = 2.56 + (n.i%4)*0.035; let P;
  if(t < n.t0) return null;
  const row={cx:CX,cy:910,w:n.w,h:CARD_H,r:32,rot:0,s:1.3,o:1,blur:0,bg:0,cO:1}; // gasto guardado, en primer plano
  if(n.hero){
    if(t < n.t0+n.d) P=poseEnter(n,t);
    else if(t < 2.56) P=poseScatter(n,t);
    else if(t < 2.72){ P=poseScatter(n,2.56); const p=E.anticip(prog(t,2.56,0.16)); P.s=lerp(1,0.94,p); P.rot=lerp(P.rot,P.rot-2,p); }
    else if(t < 5.52){ const A=poseScatter(n,2.56); A.s=.94; A.rot-=2; P=mixPose(A,FORM,E.swift(prog(t,2.72,0.74))); P.cO=1-clamp((t-2.72)/0.14); }
    else if(t < A1.super){ P=mixPose(FORM,row,E.swift(prog(t,5.52,0.56))); P.cO=clamp((t-5.84)/0.18); }
    else P = t < A2.super ? mixPose(row,posePill(n),E.snap(prog(t,A1.super,0.62))) : null;
  } else {
    const dx=n.x-540,dy=n.y-930,L=Math.hypot(dx,dy)||1;
    if(t < n.t0+n.d) P=poseEnter(n,t);
    else if(t < scat0) P=poseScatter(n,t);
    else if(t < A1[n.id]-0.14) P=mixPose(poseScatter(n,scat0),poseGhost(n),E.snap(prog(t,scat0,0.62)));
    else if(t < A1[n.id]){ P=poseGhost(n); const p=E.anticip(prog(t,A1[n.id]-0.14,0.14)); P.cx+=dx/L*16*p; P.cy+=dy/L*16*p; P.o=lerp(.2,.45,p); P.blur=lerp(6,3,p); }
    else if(t < A2[n.id]){ const G0=poseGhost(n); G0.cx+=dx/L*16; G0.cy+=dy/L*16; G0.o=.45; G0.blur=3;
      const p=prog(t,A1[n.id],0.6); P=mixPose(G0,posePill(n),E.snap(p)); P.o=lerp(.45,1,E.out(clamp(p*2.2))); P.blur=lerp(3,0,clamp(p*2)); }
  }
  if(!P){ const p=prog(t,A2[n.id],0.46); P=mixPose(posePill(n),poseSeg(n),E.snap(p)); P.cO=1-clamp(p/0.3); P.bg=E.out(clamp(p/0.7)); }
  return P;
}
function emph(t){

           out: kf(t,[[10.12,1],[10.42,.2,E.out],[11.5,.2],[11.78,1,E.out]]),

}
function sinkF(n,t){ const t0 = n.type==="in"?14.0:14.07; return E.exit(prog(t,t0+(n.i%3)*0.02,0.42)); }

function renderCards(t){
  const em=emph(t);
  for(const n of NOISE){

    if(t>=A2[n.id]+0.46){ const f=sinkF(n,t), r=SEG[n.segK]; const top=lerp(r.y,BASE,f), bot=lerp(r.y+r.h,BASE,f);
      P.cy=(top+bot)/2; P.h=bot-top; P.o=n.type==="in"?em.in:em.out; if(P.h<0.5){ hide(n.el); continue; } }

function renderSaveBar(t,em){
  if(t<7.42 || t>16.66){ hide(saveBar); return; }
  const R=SEG.save; let x,y,w,h,r=12,col=C.blue,o=1,rot=0;
  if(t<14.12){ const g=kf(t,[[7.42,0],[8.12,1,E.settle]]); h=R.h*g; x=R.x; w=R.w; y=BASE-h; o=em.save;
    const pulse=kf(t,[[13.05,0],[13.32,1,E.out],[13.75,0,E.inOut]]); w+=pulse*14; x-=pulse*7; }
  else if(t<14.32){ const p=E.anticip(prog(t,14.12,0.2)); h=R.h-16*p; w=R.w+12*p; x=R.x-6*p; y=BASE-h; }
  else if(t<16.22){ // gira 90° mientras sube en diagonal y se estira en horizontal
    const p=E.swift(prog(t,14.32,0.98));
    const a={cx:R.x+R.w/2, cy:BASE-(R.h-16)/2}, b={cx:HOVER.x+HOVER.w/2, cy:HOVER.y+HOVER.h/2};
    const ctrl={x:900,y:760}, u=1-p;
    const cx=u*u*a.cx+2*u*p*ctrl.x+p*p*b.cx, cy=u*u*a.cy+2*u*p*ctrl.y+p*p*b.cy;
    // la barra vertical (ancho R.w, alto R.h) gira -90° y adopta la forma del tramo de meta
    const L=lerp(R.h-16, HOVER.w, E.inOut(p)), Th=lerp(R.w+12, HOVER.h, E.snap(p));
    rot = -90*E.inOut(p);
    w=Th; h=L; x=cx-w/2; y=cy-h/2; r=lerp(12,30,p);
    if(t>15.3){ rot=-90; w=HOVER.h; h=HOVER.w; x=HOVER.x+HOVER.w/2-w/2; y=HOVER.y+HOVER.h/2-h/2; r=30; }
  }
  else { // el relleno blanco llega hasta ella: pequeño impacto y se vuelve blanca
    const bump=kf(t,[[16.2,0],[16.32,1,E.out],[16.6,0,E.inOut]]);
    x=HOVER.x-bump*4; w=HOVER.w+bump*8; h=HOVER.h+bump*14; y=TRACK.y-bump*7; r=30; col=mixC(C.blue,"#FFFFFF",E.out(clamp((t-16.24)/0.3))); }
  rect(saveBar,x,y,w,h); S(saveBar,"borderRadius",px(Math.min(r,h/2,w/2))); S(saveBar,"background",col); vis(saveBar,o);
  S(saveBar,"transform",`rotate(${rot.toFixed(3)}deg)`);
  S(saveBar,"zIndex","3"); S(saveBar,"boxShadow", t>14.32&&t<16.4?"0 16px 34px rgba(40,60,160,.28)":"none");
}

  const show = t>18.9 && t<22.3;
  const exitP=E.exit(prog(t,21.72,0.3));
  const W=(e,t0,{dx=0,dy=0,d=.5,ease=E.snap,s0=1}={})=>{ if(!show){hide(e);return 0;} const p=ease(prog(t,t0,d)); S(e,"transform",`translate(${((1-p)*dx).toFixed(1)}px,${((1-p)*dy).toFixed(1)}px) scale(${lerp(s0,1,p).toFixed(4)})`); vis(e,Math.min(clamp(p*1.6),1-exitP)); return p; };
  const pw=E.snap(prog(t,18.96,0.5));
  if(show){ S(winEl,"transformOrigin","50% 50%"); S(winEl,"transform",`scale(${(lerp(1.04,1,pw)*(1-exitP*0.08)).toFixed(4)})`); vis(winEl,Math.min(pw,1-exitP)); } else hide(winEl);
  rect(logoEl,128,472,300,50); W(logoEl,19.1,{dy:-30,d:.42});
  rect(greetEl,128,552,700,70); W(greetEl,19.3,{dx:-36,d:.45});
  // tarjetas de datos: entran en diagonal desde lados opuestos, con profundidad
  stats.forEach((s,i)=>{ rect(s.el,120,s.y,760,200); W(s.el,19.22+i*0.1,{dx:s.from[0],dy:s.from[1],d:.6,s0:.9});
    T(s.amt, money(Math.round(s.v*E.snap(prog(t,19.56+i*0.08,0.55)))));
    s.segs.forEach((sg,j)=>{ const q=E.snap(prog(t,19.62+i*0.08+j*0.06,0.42)); rect(sg.el,sg.x,0,Math.max(0,sg.w*q-(j<s.segs.length-1?3:0)),40); }); });
}

function tileFrom(f,t){
  if(f.from==="goal"){ const pm=E.swift(prog(t,19.0,0.78));
    const x=lerp(GOAL.x,DASH_GOAL.x,pm), y=lerp(GOAL.y,DASH_GOAL.y,pm), s=lerp(GOAL.h,DASH_GOAL.h,pm)/750;
    return {cx:x+(56+52)*s, cy:y+(48+52)*s, size:104*s, r:30*s, c:f.c0, rot:-6*(1-pm), bw:0}; }
  return {cx:NAVT[f.from].x, cy:NAV_Y, size:NAV_S, r:18, c:f.c0, rot:0, bw:0};
}
function renderTiles(t){
  for(const f of FT){
    let P=null, o=1;
    const env=clamp((t-(f.t+f.d))/0.8);
    const to={cx:f.to[0]+Math.sin(t*1.3+f.i*1.9)*3*env, cy:f.to[1]+Math.cos(t*1.1+f.i*1.3)*3.5*env, size:f.s, r:f.s*0.27, c:f.c1, rot:f.rot+Math.sin(t*0.8+f.i)*0.8*env, bw:7};
    if(f.from===null){ if(t<f.t){ hide(f.el); continue; } const p=prog(t,f.t,f.d); P={...to}; P.size*=kf(p,[[0,.2],[.65,1.06,E.out],[1,1,E.inOut]]); o=clamp(p*4); }
    else if(f.from==="goal"){
      if(t<15.22){ hide(f.el); continue; }
      if(t<f.t){ P=tileFrom(f,t); const pp=prog(t,15.22,0.5); P.size*=kf(pp,[[0,.3],[.6,1.08,E.out],[1,1,E.inOut]]); P.rot+=lerp(-20,0,E.snap(pp)); o=clamp(pp*4); }
      else { const A=tileFrom(f,f.t); P=mixPose(A,to,E.swift(prog(t,f.t,f.d))); P.c=mixC(A.c,to.c,prog(t,f.t,f.d*.7)); }
    } else {
      if(t<19.1){ hide(f.el); continue; }
      if(t<f.t){ P=tileFrom(f,t); const pp=E.snap(prog(t,19.18+[0,.05,.1,.16][f.from],0.42)); P.cy-=26*(1-pp); P.size*=lerp(.6,1,pp); o=clamp(pp*1.6); }
      else { const A=tileFrom(f,f.t); const p=E.swift(prog(t,f.t,f.d)); P=mixPose(A,to,p); P.c=mixC(A.c,to.c,clamp(p*1.4)); }
    }
    rect(f.el,P.cx-P.size/2,P.cy-P.size/2,P.size,P.size);
    S(f.el,"borderRadius",px(P.r)); S(f.el,"background",P.c); S(f.el,"fontSize",px(P.size*0.5));
    S(f.el,"borderWidth",px(P.bw||0)); S(f.el,"transform",`rotate(${(P.rot||0).toFixed(3)}deg)`);
    S(f.el,"boxShadow",(P.bw||0)>1?"0 18px 36px rgba(30,30,50,.12)":"none");
    vis(f.el,o);
  }
}

function renderClosing(t){
  if(t<=21.98){ hide(brandEl); hide(tagEl); hide(ctaEl); hide(urlEl); return; }
  vis(brandEl,1);
  brandL.forEach((l,i)=>{ const p=E.brake(prog(t,22.0+[0,.05,.08,.14,.18][i],0.62)); S(l,"transform",`translateY(${((1-p)*105).toFixed(2)}%)`); });
  const part=(e,t0,dy,d=.45)=>{ const p=E.snap(prog(t,t0,d)); S(e,"transform",`translateY(${((1-p)*dy).toFixed(1)}px)`); vis(e,p); };
  part(tagEl,22.3,22); part(ctaEl,22.4,22);
  const pu=prog(t,22.48,0.42); S(urlEl,"transform",`translateX(-50%) scale(${kf(pu,[[0,.85],[.6,1.04,E.out],[1,1,E.inOut]]).toFixed(4)})`); vis(urlEl,clamp(pu*3));
}

function renderCamera(t){ S(world,"transform",`scale(${kf(t,[[9.9,1],[13.6,1.03,E.inOut],[14.4,1,E.inOut]]).toFixed(5)})`); }

function render(t){
  t=clamp(t,0,CONFIG.duration);
  renderCamera(t); renderCaps(t); renderDash(t); renderChart(t); renderCards(t); renderCursor(t);
  renderGoal(t); renderTiles(t); renderClosing(t);
}

/* ======================= reproducción ======================= */
const player = { t:0, playing:false, last:0 };
const scrub=$("#scrub"), timeEl=$("#time"), bPlay=$("#bPlay");
function setT(t){ player.t=clamp(t,0,CONFIG.duration); render(player.t); scrub.value=player.t; timeEl.textContent=`${player.t.toFixed(2).padStart(5,"0")} / ${CONFIG.duration.toFixed(2)} s`; }
function play(){ if(player.t>=CONFIG.duration) player.t=0; player.playing=true; player.last=performance.now(); bPlay.textContent="❚❚ Pausa"; requestAnimationFrame(loop); }
function pause(){ player.playing=false; bPlay.textContent="▶ Reproducir"; }
function loop(now){ if(!player.playing) return; const dt=(now-player.last)/1000; player.last=now; setT(player.t+Math.min(dt,0.1)); if(player.t>=CONFIG.duration){ pause(); return; } requestAnimationFrame(loop); }
bPlay.onclick=()=>player.playing?pause():play();
$("#bRestart").onclick=()=>{ setT(0); play(); };
scrub.oninput=()=>{ pause(); setT(+scrub.value); };
function toggleRec(){ $("#app").classList.toggle("rec"); fit(); const h=$("#hint"); if($("#app").classList.contains("rec")){ h.style.opacity=1; setTimeout(()=>h.style.opacity=0,1800);} }
const toggleSafe=()=>$("#app").classList.toggle("safe");
$("#bHide").onclick=toggleRec; $("#bSafe").onclick=toggleSafe;
addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT"&&e.key!==" ") return;
  if(e.key===" "){ e.preventDefault(); player.playing?pause():play(); }
  else if(e.key==="r"||e.key==="R"){ setT(0); play(); }
  else if(e.key==="h"||e.key==="H") toggleRec();
  else if(e.key==="s"||e.key==="S") toggleSafe();
  else if(e.key==="ArrowRight"){ pause(); setT(player.t+(e.shiftKey?1:1/60)); }
  else if(e.key==="ArrowLeft"){ pause(); setT(player.t-(e.shiftKey?1:1/60)); } });
const marks=$("#marks"); CONFIG.scenes.forEach(([n,s])=>{ const m=el("span",null,marks,n); m.style.left=(s/CONFIG.duration*100)+"%"; m.onclick=()=>{ pause(); setT(s); }; });

function fit(){ const vp=$("#viewport"); const W=vp.clientWidth,H=vp.clientHeight; const k=Math.min(W/1080,H/1920);
  $("#stage").style.transform=`translate(${((W-1080*k)/2).toFixed(2)}px,${((H-1920*k)/2).toFixed(2)}px) scale(${k})`; }
addEventListener("resize",fit);

async function boot(){
  fit();
  const fams=["400 20px RInter","500 20px RInter","600 20px RInter","700 20px RInter","800 20px RDisplay","900 20px RDisplay"];
  try{ await Promise.all(fams.map(f=>document.fonts.load(f,"Rumbo €áéíóú"))); await document.fonts.ready; }catch(e){}
  NOISE.forEach(n=>{ n.cc.style.width="max-content"; n.w=Math.ceil(n.cc.offsetWidth); n.cc.style.width="";
  });
  // filas: dos tarjetas se reparten el ancho seguro (92–918) según su ancho real → ningún texto se tapa ni sale de la zona segura
  const rows={}; NOISE.forEach(n=>{ if(n.row) (rows[n.row]=rows[n.row]||[]).push(n); });
  Object.values(rows).forEach(([a,b])=>{ const gap=Math.max(24,(826-a.w-b.w)/3); a.x=92+gap*0.8+a.w/2; b.x=918-gap*1.2-b.w/2; });
  NOISE.forEach(n=>{ n.x=clamp(n.x, 92+n.w/2, 918-n.w/2); });
  CAPS.forEach(k=>placeCap(k.c));
  $("#loading").remove();
  const q=new URLSearchParams(location.search);
  if(q.get("controls")==="0") $("#app").classList.add("rec"), fit();
  if(q.get("safe")==="1") $("#app").classList.add("safe");
  setT(parseFloat(q.get("t"))||0);
  window.__ready=true;
  if(q.get("autoplay")!=="0") play();
}
window.rumbo={ seek:t=>{pause();setT(t);}, play, pause, duration:CONFIG.duration, render, caps:CAPS, noise:NOISE };
boot();
